cat > .github/workflows/release-drafter.yml << 'EOF'
name: Release Drafter

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update_release_draft:
    runs-on: ubuntu-latest
    steps:
      - uses: release-drafter/release-drafter@v6
        with:
          config-name: release-drafter.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
EOF

cat > .github/release-drafter.yml << 'EOF'
name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'

categories:
  - title: '🚀 Features'
    labels:
      - 'feature'
      - 'enhancement'
  - title: '🐛 Bug Fixes'
    labels:
      - 'fix'
      - 'bug'
  - title: '📝 Documentation'
    labels:
      - 'documentation'
  - title: '🧩 Commands & Skills'
    labels:
      - 'commands'
      - 'skills'
      - 'agents'
  - title: '🔧 Scripts'
    labels:
      - 'scripts'
  - title: '⚙️ CI & Config'
    labels:
      - 'ci'
      - 'config'
  - title: '🧹 Maintenance'
    labels:
      - 'chore'
      - 'dependencies'

change-template: '- $TITLE (#$NUMBER) @$AUTHOR'
change-title-escapes: '\<*_&'

version-resolver:
  major:
    labels:
      - 'major'
  minor:
    labels:
      - 'feature'
      - 'enhancement'
  patch:
    labels:
      - 'fix'
      - 'bug'
      - 'documentation'
      - 'chore'
      - 'ci'
      - 'config'
  default: patch

exclude-labels:
  - 'skip-changelog'

template: |
  ## What's Changed

  $CHANGES

  **Full Changelog**: https://github.com/danmackenz/ghostspend/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION
EOF
