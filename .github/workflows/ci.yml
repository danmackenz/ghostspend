name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: ./scripts
          severity: warning

  syntax-check:
    name: Bash syntax check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check Bash syntax
        run: |
          set -euo pipefail
          for file in scripts/*.sh; do
            echo "Checking ${file}"
            bash -n "${file}"
          done

  markdown-lint:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install markdownlint-cli2
        run: npm install --global markdownlint-cli2

      - name: Lint Markdown files
        run: |
          set -euo pipefail
          markdownlint-cli2 \
            --config .markdownlint-cli2.json \
            "**/*.md" \
            "#node_modules" \
            "#LICENSE.md"

  fence-style:
    name: Code fence style
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check every closing code fence is bare
        run: |
          set -uo pipefail
          rc=0
          while IFS= read -r file; do
            awk -v f="$file" '
              /^````/ { f4 = !f4; next }
              f4      { next }
              /^```/  { if (n % 2 == 1 && $0 != "```") {
                          printf "::error file=%s,line=%d::Closing code fence must be bare ```, not %s\n", f, FNR, $0
                          bad = 1
                        }
                        n++ }
              END     { if (n % 2 != 0) {
                          printf "::error file=%s::Unclosed code fence (%d fence markers)\n", f, n
                          bad = 1
                        }
                        exit bad }
            ' "$file" || rc=1
          done < <(git ls-files '*.md' | grep -v '^LICENSE.md$')
          exit "$rc"

  json-validate:
    name: Validate JSON manifests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate JSON files
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          files = [
              Path(".claude-plugin/plugin.json"),
              Path(".claude-plugin/marketplace.json"),
              Path("package.json"),
          ]

          for path in files:
              with path.open(encoding="utf-8") as file:
                  json.load(file)
              print(f"{path} is valid JSON")
          PY